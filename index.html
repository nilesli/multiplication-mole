<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD166">
<meta name="format-detection" content="telephone=no">
<title>Iu Shan｜乘法打地鼠</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B9%3C/text%3E%3C/svg%3E">
<style>
:root{
  --font:"Arial Rounded MT Bold","Varela Round","Nunito","Yuanti TC","PingFang HK","PingFang TC","Noto Sans TC","Noto Sans HK","Noto Sans CJK TC","Noto Sans CJK HK","Microsoft JhengHei",sans-serif;
  --ink:#3D3D6B;
  --pink:#FF6B8B;
  --orange:#FF9F43;
  --yellow:#FFD166;
  --green:#58C25B;
  --blue:#54A0FF;
  --purple:#8E7CFF;
  --S:max(240px, min(94vw, 620px, calc(100vh - 345px)));
}
@supports (height:100svh){
  :root{ --S:max(240px, min(94vw, 620px, calc(100svh - 345px))); }
}
@media (max-width:600px){
  :root{ --S:max(240px, min(94vw, 620px, calc(100vh - 255px))); }
  @supports (height:100svh){ :root{ --S:max(240px, min(94vw, 620px, calc(100svh - 255px))); } }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  color:var(--ink);
  min-height:100vh;
  background:#FFF1E6;
  overflow-x:hidden;
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
/* ---------- illustrated background (image chosen by aspect ratio) ---------- */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-color:#FFF1E6;background-position:center;background-size:cover;background-repeat:no-repeat;}
/* ---------- layout ---------- */
.app{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:10px 12px calc(16px + env(safe-area-inset-bottom));}
.top{text-align:center;padding:4px 50px 6px;}
.school{
  display:inline-block;font-size:clamp(24px,5.6vw,40px);font-weight:900;letter-spacing:2px;color:#fff;
  padding:2px 22px 4px;border-radius:999px;
  background:linear-gradient(90deg,#FF6B8B,#FF9F43,#FFC93C);
  box-shadow:0 4px 0 #E0557A,0 8px 18px rgba(255,107,139,.35);
  text-shadow:0 2px 0 rgba(0,0,0,.15);
  font-family:"Arial Rounded MT Bold","Varela Round","Nunito",Arial,sans-serif;
}
.title{
  margin:6px 0 0;font-size:clamp(22px,5vw,36px);font-weight:900;letter-spacing:3px;color:#6C5CE7;
  text-shadow:0 3px 0 #fff, 0 5px 0 rgba(108,92,231,.18);
}
.icon-btn{
  position:absolute;top:12px;right:12px;width:46px;height:46px;border-radius:50%;border:3px solid #fff;
  background:#FFD166;font-size:22px;cursor:pointer;box-shadow:0 4px 0 #E0A800;z-index:5;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #E0A800;}
.screen{display:none;}
.screen.active{display:block;animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.card{
  background:rgba(255,255,255,.93);border-radius:28px;padding:22px 20px;
  box-shadow:0 8px 0 rgba(108,92,231,.15),0 14px 30px rgba(0,0,0,.08);
  border:4px solid #fff;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:20px;font-weight:900;color:#fff;border:none;border-radius:999px;
  padding:13px 26px;cursor:pointer;background:var(--green);
  box-shadow:0 5px 0 #3E9A41;transition:transform .08s;touch-action:manipulation;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3E9A41;}
.btn.big{font-size:26px;padding:14px 44px;}
.btn.gold{background:linear-gradient(180deg,#FFC93C,#FF9F43);box-shadow:0 5px 0 #D97B1C;}
.btn.gold:active{box-shadow:0 2px 0 #D97B1C;}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 #2E78D6;}
.linkbtn{background:none;border:none;color:#6C5CE7;font-size:16px;text-decoration:underline;cursor:pointer;margin-top:10px;font-weight:700;}
/* ---------- start ---------- */
.start-card{max-width:520px;margin:10px auto;text-align:center;}
.start-mole{width:150px;height:156px;margin:-6px auto -6px;background-size:100% 100%;background-repeat:no-repeat;animation:bob 2s ease-in-out infinite;}
.start-mole{position:relative;}
.start-mole::after{content:'×';position:absolute;left:50.1%;top:60.3%;transform:translate(-50%,-52%);font-size:34px;font-weight:900;color:#FF6B8B;line-height:1;font-family:"Arial Rounded MT Bold",Arial,sans-serif;}
@media (max-height:860px) and (min-width:601px){
  .start-mole{width:124px;height:129px;}
  .start-mole::after{font-size:28px;}
  .rules{line-height:1.55;margin-bottom:10px;padding:8px 14px;}
  .start-card{padding-top:14px;padding-bottom:16px;}
  .start-card .btn{margin-top:12px;}
}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.start-card h2{margin:6px 0 10px;font-size:clamp(22px,5vw,28px);color:#FF6B8B;}
.rules{list-style:none;padding:12px 14px;margin:0 0 16px;text-align:left;background:#FFF8E1;border-radius:18px;font-size:17px;line-height:1.75;border:3px dashed #FFD166;}
.start-card label{display:block;font-size:19px;font-weight:900;margin-bottom:8px;}
#nameInput{
  width:100%;max-width:320px;font-size:22px;font-family:inherit;text-align:center;padding:12px 16px;
  border-radius:18px;border:4px solid #8E7CFF;outline:none;color:var(--ink);background:#fff;
}
#nameInput:focus{border-color:#FF6B8B;box-shadow:0 0 0 5px rgba(255,107,139,.2);}
.error{color:#E63946;font-weight:900;margin-top:8px;}
.extra-row{display:flex;gap:10px;max-width:320px;margin:12px auto 0;}
.extra-row[hidden]{display:none;}
.start-card .extra-row label{flex:1;display:block;font-size:15px;font-weight:700;text-align:left;margin:0;color:#6B6B95;}
.extra-row input{
  display:block;width:100%;margin-top:4px;font-size:18px;font-family:inherit;text-align:center;padding:8px 10px;
  border-radius:14px;border:3px solid #C9C1FF;outline:none;color:var(--ink);background:#fff;
}
.extra-row input:focus{border-color:#FF6B8B;}
.send-status{
  display:inline-flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:8px 10px;margin:12px auto 0;padding:8px 16px;
  border-radius:999px;font-size:16px;font-weight:900;background:#EAF3FF;color:#2E78D6;border:2px solid #BBD7FF;
}
.send-status[hidden]{display:none;}
.send-status.ok{background:#ECFFE9;color:#2B9A3E;border-color:#9BE39B;}
.send-status.fail{background:#FFF4E5;color:#C66A00;border-color:#FFC98A;border-radius:20px;}
.send-status button{
  font-size:15px;font-weight:900;color:#fff;background:#FF9F43;border:none;border-radius:999px;padding:6px 14px;cursor:pointer;
  box-shadow:0 3px 0 #D97B1C;
}
.send-status button:active{transform:translateY(2px);box-shadow:0 1px 0 #D97B1C;}
.start-card .btn{margin-top:16px;}
/* ---------- game ---------- */
.hud{display:flex;justify-content:center;gap:12px;margin:2px auto 6px;max-width:var(--S);}
.pill{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;border-radius:999px;
  padding:7px 14px;font-size:clamp(17px,4.4vw,22px);font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.08);border:3px solid #FFD166;
  white-space:nowrap;
}
.pill b{font-size:1.3em;color:#FF6B8B;min-width:1.4em;text-align:center;}
.pill.timer{border-color:#54A0FF;}
.pill.timer b{color:#2E78D6;}
.pill.timer.danger{background:#FF4D4D;border-color:#C62828;color:#fff;animation:pulse .5s ease-in-out infinite alternate;}
.pill.timer.danger b{color:#fff;}
@keyframes pulse{from{transform:scale(1);}to{transform:scale(1.08);}}
.timebar{max-width:var(--S);height:12px;margin:0 auto 8px;background:rgba(255,255,255,.8);border-radius:99px;overflow:hidden;border:2px solid #fff;}
#timebarFill{height:100%;width:100%;background:linear-gradient(90deg,#58C25B,#FFD166);border-radius:99px;}
.timebar.danger #timebarFill{background:#FF4D4D;}
.question{
  max-width:var(--S);margin:0 auto 10px;text-align:center;background:#fff;border-radius:24px;
  padding:6px 10px;font-size:clamp(38px,9vw,60px);font-weight:900;letter-spacing:2px;line-height:1.25;
  box-shadow:0 5px 0 rgba(108,92,231,.18);border:4px solid #C9C1FF;
  font-family:"Arial Rounded MT Bold","Varela Round","Nunito",Arial,sans-serif;
}
.question .qa{color:#FF6B8B;}
.question .qb{color:#2E78D6;}
.question .op{color:#FF9F43;}
.question .qmark{color:#8E7CFF;display:inline-block;animation:bob 1.2s ease-in-out infinite;}
.question.newq{animation:qpop .35s ease;}
@keyframes qpop{0%{transform:scale(.85);}60%{transform:scale(1.06);}100%{transform:scale(1);}}
.board-wrap{position:relative;width:var(--S);height:var(--S);margin:0 auto;}
.grid{
  width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:1%;padding:2%;border-radius:30px;
  background-color:#8FD95A;background-position:center;background-size:cover;
  box-shadow:0 8px 0 #3E9A41,0 16px 30px rgba(0,0,0,.12);border:5px solid #fff;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.hole{
  position:relative;border:0;background:none;padding:0;margin:0;cursor:pointer;width:100%;height:100%;
  -webkit-tap-highlight-color:transparent;touch-action:none;outline:none;
}
.hole:focus-visible{outline:4px solid #6C5CE7;outline-offset:2px;border-radius:16px;}

.mclip{position:absolute;inset:0;-webkit-clip-path:polygon(17.45% 0.00%,17.45% 64.59%,20.32% 66.02%,20.85% 76.33%,21.70% 76.53%,22.55% 76.94%,23.40% 77.55%,24.26% 79.39%,25.11% 79.29%,25.96% 79.18%,26.81% 79.08%,27.66% 79.18%,28.51% 79.39%,29.36% 79.69%,30.21% 80.20%,31.06% 81.53%,31.91% 81.22%,32.77% 81.02%,33.62% 80.92%,34.47% 80.82%,35.32% 80.92%,36.17% 81.02%,37.02% 81.22%,37.87% 81.53%,38.72% 82.04%,39.57% 82.86%,40.43% 83.57%,41.28% 83.06%,42.13% 82.86%,42.98% 82.65%,43.83% 82.65%,44.68% 82.65%,45.53% 82.76%,46.38% 82.96%,47.23% 83.27%,48.09% 83.67%,48.94% 84.39%,49.79% 84.08%,50.64% 83.57%,51.49% 83.16%,52.34% 82.96%,53.19% 82.76%,54.04% 82.76%,54.89% 82.96%,55.74% 83.27%,56.60% 83.67%,57.45% 83.47%,58.30% 82.86%,59.15% 82.55%,60.00% 82.24%,60.85% 82.14%,61.70% 82.24%,62.55% 82.35%,63.40% 82.65%,64.26% 83.06%,65.11% 82.04%,65.96% 81.43%,66.81% 81.02%,67.66% 80.82%,68.51% 80.61%,69.36% 80.61%,70.21% 80.61%,71.06% 80.82%,71.91% 81.12%,72.77% 80.00%,73.62% 79.39%,74.47% 78.88%,75.32% 78.57%,76.17% 78.57%,77.02% 78.57%,77.87% 78.06%,78.72% 76.33%,79.89% 66.02%,82.66% 64.59%,82.66% 0.00%);clip-path:polygon(17.45% 0.00%,17.45% 64.59%,20.32% 66.02%,20.85% 76.33%,21.70% 76.53%,22.55% 76.94%,23.40% 77.55%,24.26% 79.39%,25.11% 79.29%,25.96% 79.18%,26.81% 79.08%,27.66% 79.18%,28.51% 79.39%,29.36% 79.69%,30.21% 80.20%,31.06% 81.53%,31.91% 81.22%,32.77% 81.02%,33.62% 80.92%,34.47% 80.82%,35.32% 80.92%,36.17% 81.02%,37.02% 81.22%,37.87% 81.53%,38.72% 82.04%,39.57% 82.86%,40.43% 83.57%,41.28% 83.06%,42.13% 82.86%,42.98% 82.65%,43.83% 82.65%,44.68% 82.65%,45.53% 82.76%,46.38% 82.96%,47.23% 83.27%,48.09% 83.67%,48.94% 84.39%,49.79% 84.08%,50.64% 83.57%,51.49% 83.16%,52.34% 82.96%,53.19% 82.76%,54.04% 82.76%,54.89% 82.96%,55.74% 83.27%,56.60% 83.67%,57.45% 83.47%,58.30% 82.86%,59.15% 82.55%,60.00% 82.24%,60.85% 82.14%,61.70% 82.24%,62.55% 82.35%,63.40% 82.65%,64.26% 83.06%,65.11% 82.04%,65.96% 81.43%,66.81% 81.02%,67.66% 80.82%,68.51% 80.61%,69.36% 80.61%,70.21% 80.61%,71.06% .mmove{position:absolute;inset:0;transform:translateY(86%);}
.hole.up .mmove{animation:pop .5s cubic-bezier(.3,1.4,.5,1) var(--d,0ms) both;}
@keyframes pop{from{transform:translateY(86%);}to{transform:translateY(0);}}
.mbody{position:absolute;inset:0;transform-origin:50% 72%;}
.mimg{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;visibility:hidden;}
.mimg.normal{visibility:visible;}
.hole.hit .mimg.normal,.hole.tried .mimg.normal{visibility:hidden;}
.hole.hit .mimg.happy,.hole.tried .mimg.sad{visibility:visible;}
/* number centred on the blank sign (sign ≈ x 27.8–72.4 %, y 48–72.4 % of the picture) */
.num{
  position:absolute;left:50.1%;top:60.3%;width:42%;height:22%;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--S) * .078);font-weight:900;color:#3D3D6B;letter-spacing:-.02em;line-height:1;
  font-family:"Arial Rounded MT Bold","Varela Round","Nunito",Arial,sans-serif;
}
.num.n3{font-size:calc(var(--S) * .06);}
.hole.hit .mbody{animation:bonk .3s ease;}
.hole.hit .num{color:#2B9A3E;}
@keyframes bonk{0%{transform:scale(1,1);}30%{transform:scale(1.08,.88);}60%{transform:scale(.97,1.05) translateY(-3%);}100%{transform:scale(1,1);}}
.hole.wrong .mbody{animation:shake .5s ease;}
.hole.tried .num{color:#E63946;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-5%) rotate(-5deg);}40%{transform:translateX(5%) rotate(5deg);}60%{transform:translateX(-3%) rotate(-2deg);}80%{transform:translateX(3%);}}
.hole.tried .mimg{filter:grayscale(.7) brightness(1.06);}
.floater{
  position:absolute;left:50%;top:0;transform:translate(-50%,0);pointer-events:none;z-index:3;
  font-size:calc(var(--S) * .09);font-weight:900;color:#FF6B8B;text-shadow:0 3px 0 #fff,0 0 8px #fff;
  animation:floatup .8s ease-out forwards;white-space:nowrap;
}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0) scale(.7);}to{opacity:0;transform:translate(-50%,-80%) scale(1.25);}}
/* hint overlay */
.hint-overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;
  background:rgba(255,255,255,.45);border-radius:30px;padding:4%;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.hint-overlay[hidden],.timeup[hidden]{display:none;}
.hint-card{
  background:#fff;border-radius:24px;border:5px solid #FF8FA3;padding:14px 16px;text-align:center;max-width:100%;
  box-shadow:0 8px 0 rgba(255,107,139,.25),0 14px 30px rgba(0,0,0,.15);animation:qpop .35s ease;
}
.hint-head{font-size:clamp(18px,4.6vw,24px);font-weight:900;color:#E63946;margin-bottom:8px;}
.hint-text{font-size:clamp(17px,4.4vw,23px);font-weight:700;line-height:1.55;background:#FFF8E1;border-radius:16px;padding:10px 12px;border:3px dashed #FFC93C;}
.hint-count{position:relative;width:70px;height:70px;margin:10px auto 2px;}
.hint-count svg{position:absolute;inset:0;transform:rotate(-90deg);}
.hint-count circle{fill:none;stroke-width:8;}
.hint-count .track{stroke:#FFE0E6;}
.hint-count .ring{stroke:#FF6B8B;stroke-linecap:round;stroke-dasharray:188.5;stroke-dashoffset:0;}
.hint-count.run .ring{animation:ring 3s linear forwards;}
@keyframes ring{to{stroke-dashoffset:188.5;}}
.hint-count span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#FF6B8B;font-family:"Arial Rounded MT Bold",Arial,sans-serif;}
.hint-foot{font-size:15px;font-weight:700;color:#888;}
.timeup{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:7;
  font-size:calc(var(--S) * .13);font-weight:900;color:#fff;background:rgba(108,92,231,.55);border-radius:30px;
  text-shadow:0 4px 0 #FF6B8B;animation:qpop .4s ease;
}
/* ---------- results ---------- */
.result-card{max-width:720px;margin:10px auto;text-align:center;}
.result-title{font-size:clamp(28px,7vw,40px);font-weight:900;color:#FF6B8B;}
.result-name{font-size:20px;font-weight:700;margin-top:4px;}
.result-score{font-size:clamp(56px,14vw,84px);font-weight:900;color:#FF9F43;line-height:1.1;text-shadow:0 4px 0 #FFE3B3;}
.result-score small{font-size:.4em;color:var(--ink);}
.result-msg{font-size:20px;font-weight:900;color:#6C5CE7;margin:4px 0 14px;}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:6px;}
.section-title{text-align:left;font-size:22px;margin:22px 0 10px;color:#6C5CE7;}
.wrong-list{display:grid;gap:10px;text-align:left;}
.wrong-item{background:#FFF5F7;border:3px solid #FFC2CF;border-radius:18px;padding:10px 14px;}
.wrong-item .wq{font-size:24px;font-weight:900;font-family:"Arial Rounded MT Bold","Varela Round",var(--font);}
.wrong-item .wq .ok{color:#2B9A3E;}
.wrong-item .wa{font-size:17px;margin:2px 0;}
.wrong-item .wa s{color:#E63946;font-weight:900;}
.wrong-item .we{font-size:17px;line-height:1.55;background:#fff;border-radius:12px;padding:6px 10px;margin-top:4px;}
.praise{background:#ECFFE9;border:3px solid #9BE39B;border-radius:18px;padding:16px;font-size:20px;font-weight:900;color:#2B9A3E;}
#certPreview{width:100%;max-width:640px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.15);display:block;margin:0 auto;-webkit-touch-callout:default;}
.tip{font-size:15px;color:#777;margin:10px 0 0;}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;}
@media (max-width:600px){
  .app{padding:8px 8px calc(14px + env(safe-area-inset-bottom));}
  .top{padding:2px 48px 4px;}
  .icon-btn{top:8px;right:8px;width:42px;height:42px;font-size:20px;}
  .card{padding:16px 14px;border-radius:24px;}
  .rules{font-size:16px;}
  .grid,.hint-overlay,.timeup{border-radius:22px;}
  .hint-count{width:60px;height:60px;}
}
@media (prefers-reduced-motion:reduce){
  .start-mole,.question .qmark,.pill.timer.danger{animation:none !important;}
}

<body>
<div id="bg" aria-hidden="true"></div>
<div class="app">
  <button id="muteBtn" class="icon-btn" type="button" aria-label="聲音：開">🔊</button>
  <header class="top">
    <div class="school">Iu Shan</div>
    <h1 class="title">乘法打地鼠</h1>
  </header>

  <main>
    <!-- Start screen -->
    <section id="screen-start" class="screen active" aria-label="開始">
      <div class="card start-card">
        <div class="start-mole" aria-hidden="true"></div>
        <h2>0 – 10 乘法大挑戰！</h2>
        <ul class="rules">
          <li>⏱️ 你有 <b id="ruleTime">60</b> 秒時間</li>
          <li>🔍 看清楚上面的乘法題</li>
          <li>🔨 打中拿着正確答案的地鼠，得 1 分</li>
          <li>💡 打錯會暫停 3 秒，看提示後再試一次</li>
        </ul>
        <label for="nameInput">請輸入你的名字：</label>
        <input id="nameInput" type="text" maxlength="20" autocomplete="off" enterkeyhint="go" placeholder="例如：陳小明">
        <div id="nameError" class="error" hidden>請先輸入你的名字！</div>
        <div class="extra-row" id="extraRow" hidden>
          <label>班別（選填）<input id="classInput" type="text" maxlength="10" autocomplete="off" enterkeyhint="go" placeholder="例如：4A"></label>
          <label>學號（選填）<input id="classNoInput" type="text" inputmode="numeric" maxlength="4" autocomplete="off" enterkeyhint="go" placeholder="例如：12"></label>
        </div>
        <div><button id="startBtn" class="btn big" type="button">開始 ▶</button></div>
      </div>
    </section>

    <!-- Game screen -->
    <section id="screen-game" class="screen" aria-label="遊戲">
      <div class="hud">
        <div class="pill score">⭐ 分數 <b id="score">0</b></div>
        <div class="pill timer" id="timerPill">⏱️ <b id="timer">60</b> 秒</div>
      </div>
      <div class="timebar" id="timebar"><div id="timebarFill"></div></div>
      <div class="question" id="question" aria-live="polite">
        <span class="qa" id="qa">0</span> <span class="op">×</span> <span class="qb" id="qb">0</span> <span class="op">=</span> <span class="qmark">?</span>
      </div>
      <div class="board-wrap">
        <div class="grid" id="grid" role="group" aria-label="地鼠答案"></div>
        <div class="hint-overlay" id="hintOverlay" hidden role="alert">
          <div class="hint-card">
            <div class="hint-head">❌ 你選了 <span id="hintChosen"></span>，再想一想！</div>
            <div class="hint-text" id="hintText"></div>
            <div class="hint-count" id="hintCountBox">
              <svg viewBox="0 0 70 70"><circle class="track" cx="35" cy="35" r="30"/><circle class="ring" cx="35" cy="35" r="30"/></svg>
              <span id="hintCount">3</span>
            </div>
            <div class="hint-foot">秒後再試一次同一題</div>
          </div>
        </div>
        <div class="timeup" id="timeup" hidden>⏰ 時間到！</div>
      </div>
    </section>

    <!-- Results screen -->
    <section id="screen-result" class="screen" aria-label="成績">
      <div class="card result-card">
        <div class="result-title">🎉 完成挑戰！</div>
        <div class="result-name"><span id="resName"></span>，你的得分是：</div>
        <div class="result-score"><span id="resScore">0</span><small> 分</small></div>
        <div class="result-msg" id="resMsg"></div>
        <div class="btn-row">
          <button id="againBtn" class="btn blue" type="button">🔄 再玩一次</button>
          <button id="certBtn" class="btn gold" type="button">🏆 下載嘉許狀</button>
        </div>
        <div><div id="sendStatus" class="send-status" hidden role="status" aria-live="polite">
          <span id="sendText"></span>
          <button id="retryBtn" type="button" hidden>🔁 重新傳送</button>
        </div></div>
        <button id="changeBtn" class="linkbtn" type="button">換另一位同學</button>

        <h3 class="section-title">📊 錯題記錄 <span id="wrongCount"></span></h3>
        <div id="wrongList" class="wrong-list"></div>

        <h3 class="section-title">🏆 嘉許狀預覽</h3>
        <img id="certPreview" alt="嘉許狀預覽">
        <p class="tip">📱 iPhone / iPad：如未能直接下載，可長按上面的嘉許狀圖片，選擇「儲存到照片」。</p>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  'use strict';

  /* ======================================================================
   *  ⚙️ 老師設定 TEACHER CONFIG
   *  把 Google Apps Script「網頁應用程式」網址（以 /exec 結尾）貼在下面引號內，
   *  例如：const SHEET_URL = 'https://script.google.com/macros/s/XXXX/exec';
   *  留空 '' = 不傳送成績，遊戲照常運作。
   *  （設定步驟見「設定Google試算表步驟.md」）
   * ====================================================================== */
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyddUuPH0Z8zJhJFFDmTW2rUWEitpQ9sh8UEGNqKd7TFLexHMB8VCwfNXeDJ4Bd94d1gA/exec';

  /* ================= Settings ================= */
  var params = new URLSearchParams(location.search);
  var GAME_TIME = 60;
  var tParam = parseInt(params.get('time'), 10);
  if (tParam >= 1 && tParam <= 600) GAME_TIME = tParam;   // testing aid, default 60
  var LOCK_MS = 3000;
  var HIT_MS = 280;

  var $ = function (s) { return document.querySelector(s); };
  function randInt(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ================= Illustrated assets: preload + decode before first use ================= */
  var ASSETS = window.MOLE_ASSETS || {};
  var IMG = {};
  var assetsReady = Promise.all(['mole_normal', 'mole_happy', 'mole_sad', 'grass_board'].map(function (k) {
    return new Promise(function (resolve) {
      var im = new Image();
      IMG[k] = im;
      im.onload = function () { if (im.decode) im.decode().then(resolve, resolve); else resolve(); };
      im.onerror = function () { resolve(); };
      im.src = ASSETS[k];
    });
  }));

  /* ================= Sound (Web Audio, optional) ================= */
  var sound = {
    ctx: null,
    muted: store.get('moleMuted') === '1',
    ensure: function () {
      if (this.muted) return null;
      if (!this.ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try { this.ctx = new AC(); } catch (e) { return null; }
      }
      if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
      return this.ctx;
    },
    tone: function (freq, start, dur, type, vol) {
      var c = this.ensure(); if (!c) return;
      try {
        var t = c.currentTime + start;
        var o = c.createOscillator(), g = c.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination);
        o.start(t); o.stop(t + dur + 0.05);
      } catch (e) {}
    },
    correct: function () { this.tone(660, 0, 0.12, 'triangle'); this.tone(990, 0.09, 0.2, 'triangle'); },
    wrong: function () { this.tone(240, 0, 0.22, 'sawtooth', 0.1); this.tone(170, 0.16, 0.32, 'sawtooth', 0.1); },
    tick: function () { this.tone(880, 0, 0.07, 'square', 0.05); },
    end: function () { var self = this; [523, 659, 784, 1047].forEach(function (f, i) { self.tone(f, i * 0.13, 0.3, 'triangle', 0.16); }); }
  };
  var muteBtn = $('#muteBtn');
  function renderMute() {
    muteBtn.textContent = sound.muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', sound.muted ? '聲音：關' : '聲音：開');
  }
  renderMute();
  muteBtn.addEventListener('click', function () {
    sound.muted = !sound.muted;
    store.set('moleMuted', sound.muted ? '1' : '0');
    renderMute();
    if (!sound.muted) sound.tick();
  });

  /* ================= Questions, distractors, hints ================= */
  function makeOptions(a, b) {
    var p = a * b;
    var used = {}; used[p] = true;
    var out = [];
    function add(v) {
      if (out.length >= 8) return;
      if (typeof v !== 'number' || !isFinite(v) || v % 1 !== 0) return;
      v = v + 0; // normalise -0
      if (v < 0 || v > 121 || used[v]) return;
      used[v] = true; out.push(v);
    }
    // Most common mistakes: neighbouring facts in the times table, adding instead of multiplying, off-by-one
    var strong = [a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, a + b, p + 1, p - 1];
    if (a === 0 || b === 0) strong.push(a, b);          // e.g. 7 × 0 → children often answer 7
    if (a === 1 || b === 1) strong.push(a + b + 1);
    shuffle(strong);
    var swapped = p >= 10 ? parseInt(String(p).split('').reverse().join(''), 10) : -1; // 12 ↔ 21
    var medium = shuffle([p + 2, p - 2, p + 10, p - 10, (a + 1) * (b + 1), (a - 1) * (b - 1),
                          a * (b + 2), (a + 2) * b, swapped, p + 5, p - 5, Math.abs(a - b)]);
    strong.slice(0, 5).forEach(add);
    medium.forEach(add);
    strong.slice(5).forEach(add);
    var lo = Math.max(0, p - 12), hi = p + 12, guard = 0;
    while (out.length < 8 && guard++ < 500) add(randInt(lo, hi));
    for (var v = 0; out.length < 8; v++) add(v);   // safety net
    var options = shuffle(out.concat([p]));
    return options;
  }

  var NB = '\u00a0';
  function m(a, b) { return a + NB + '×' + NB + b; }   // keep "3 × 4" on one line
  function repeatedAdd(a, b) {
    var s = Math.min(a, b), l = Math.max(a, b), parts = [];
    for (var i = 0; i < s; i++) parts.push(l);
    return { s: s, l: l, expr: parts.join(NB + '+ ') };   // only break after a "+"

  }

  // Hint shown after a wrong tap: teaches the method without stating the product
  function hintFor(a, b) {
    var p = a * b;

      drawMedal(x, W - 290, 860, 92);
      for (var s = 0; s < 5; s++) star(x, W / 2 - 200 + s * 100, 900 - (s === 2 ? 22 : (s % 2 ? 10 : 0)), s === 2 ? 40 : 30, ['#FF8FA3', '#FFC93C', '#FF9F43', '#FFC93C', '#54A0FF'][s], '#fff', 0);
      x.strokeStyle = '#FFB37A'; x.lineWidth = 4; x.setLineDash([2, 14]); x.lineCap = 'round';
      x.beginPath(); x.moveTo(W / 2 - 300, 980); x.lineTo(W / 2 + 300, 980); x.stroke(); x.setLineDash([]);

      var url = c.toDataURL('image/jpeg', 0.95);
      window.__certTexts = texts;
      return { url: url, blob: dataURLtoBlob(url) };
    });
  }

  function dataURLtoBlob(url) {
    try {
      var parts = url.split(','), bin = atob(parts[1]), n = bin.length, arr = new Uint8Array(n);
      for (var i = 0; i < n; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: 'image/jpeg' });
    } catch (e) { return null; }
  }

  function downloadCertificate() {
    var go = function () {
      var fname = '嘉許狀_' + (state.name.replace(/[\\\/:*?"<>|\s]+/g, '_') || '學生') + '.jpg';
      var a = document.createElement('a');
      if ('download' in a) {
        var href = state.certURL, revoke = null;
        if (state.certBlob && window.URL && URL.createObjectURL) { href = URL.createObjectURL(state.certBlob); revoke = href; }
        a.href = href; a.download = fname; a.rel = 'noopener';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        if (revoke) setTimeout(function () { URL.revokeObjectURL(revoke); }, 4000);
      } else {
        // old iOS Safari: open the picture so it can be long-pressed and saved
        var w = null;
        try { w = window.open(state.certBlob ? URL.createObjectURL(state.certBlob) : state.certURL, '_blank'); } catch (e) {}
        if (!w) { var img = $('#certPreview'); img.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      }
    };
    if (state.certURL) go();
    else buildCertificate(state.name, state.score).then(function (res) {
      state.certURL = res.url; state.certBlob = res.blob; $('#certPreview').src = res.url; go();
    });
  }

  /* ================= Confetti ================= */
  function confetti() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cv = document.createElement('canvas'); cv.id = 'confetti';
    document.body.appendChild(cv);
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
    var x = cv.getContext('2d');
    var colors = ['#FF6B8B', '#FFC93C', '#54A0FF', '#1DD1A1', '#8E7CFF', '#FF9F43'];
    var ps = [];
    for (var i = 0; i < 140; i++) ps.push({
      x: Math.random() * W, y: -Math.random() * H * 0.6, w: (6 + Math.random() * 8) * dpr, h: (8 + Math.random() * 10) * dpr,
      vx: (Math.random() - 0.5) * 3 * dpr, vy: (2 + Math.random() * 4) * dpr, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
      c: colors[i % colors.length]
    });
    var t0 = performance.now();
    (function frame(t) {
      x.clearRect(0, 0, W, H);
      ps.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore();
      });
      if (t - t0 < 3500) requestAnimationFrame(frame);
      else if (cv.parentNode) cv.parentNode.removeChild(cv);
    })(t0);
  }

  /* ================= Send results to Google Sheet (optional) ================= */
  var QUEUE_KEY = 'moleSheetQueue';
  var memQueue = [];
  var storageOK = (function () {
    try { localStorage.setItem('__moleTest', '1'); localStorage.removeItem('__moleTest'); return true; } catch (e) { return false; }
  })();
  function loadQueue() {
    if (!storageOK) return memQueue.slice();
    try { var q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); return Array.isArray(q) ? q : []; }
    catch (e) { return []; }
  }
  function saveQueue(q) {
    q = q.slice(-300);                      // keep at most 300 unsent records
    memQueue = q.slice();
    if (!storageOK) return;
    try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e) {}
  }
  function inQueue(id) { return loadQueue().some(function (r) { return r.id === id; }); }

  function hkISO(d) {                       // e.g. 2026-10-07T18:45:12+08:00 (Hong Kong time, whatever the device zone)
    return new Date(d.getTime() + 8 * 3600 * 1000).toISOString().slice(0, 19) + '+08:00';
  }
  function makeRecord() {
    var summary = state.wrongs.map(function (w) {
      return w.a + '×' + w.b + ' 揀了' + w.chosen + '（應為' + w.ans + '）';
    }).join('; ');
    return {
      id: Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8),
      timestamp: hkISO(new Date()),
      name: state.name,
      className: state.className || '',
      classNo: state.classNo || '',
      score: state.score,
      attempts: state.score + state.wrongs.length,
      wrongCount: state.wrongs.length,
      wrongSummary: summary || '無'
    };
  }

  function sendOne(rec) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 15000) : null;
    var opts = {
      method: 'POST',
      mode: 'no-cors',                       // Apps Script has no CORS headers; response is opaque
      cache: 'no-store',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // "simple" request → no preflight
      body: JSON.stringify(rec)
    };
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(SHEET_URL, opts).then(
      function () { if (timer) clearTimeout(timer); },
      function (err) { if (timer) clearTimeout(timer); throw err; }
    );
  }

  var flushing = null;
  function flushQueue() {
    if (!SHEET_URL || !window.fetch) return Promise.resolve(false);
    if (flushing) return flushing;
    function next() {
      var q = loadQueue();
      if (!q.length) return Promise.resolve(true);
      var rec = q[0];
      return sendOne(rec).then(function () {
        saveQueue(loadQueue().filter(function (r) { return r.id !== rec.id; }));
        return next();
      }, function () { return false; });
    }
    flushing = next().then(function (ok) { flushing = null; return ok; }, function () { flushing = null; return false; });
    return flushing;
  }

  var currentSendId = null;
  function setSendStatus(kind) {
    var box = $('#sendStatus'), text = $('#sendText'), retry = $('#retryBtn');
    box.hidden = false;
    box.className = 'send-status' + (kind === 'ok' ? ' ok' : kind === 'fail' ? ' fail' : '');
    retry.hidden = kind !== 'fail';
    if (kind === 'sending') text.textContent = '正在傳送成績…';
    else if (kind === 'ok') text.textContent = '✅ 成績已傳送給老師';
    else {
      var n = loadQueue().length;
      text.textContent = '⚠️ 傳送失敗，請檢查網絡' + (n > 1 ? '（共 ' + n + ' 份成績等待傳送）' : '');
    }
  }
  function trySendCurrent() {
    var id = currentSendId;
    if (!id) return;
    setSendStatus('sending');
    // wait for any flush already running, then flush again so this record is included
    (flushing || Promise.resolve()).then(flushQueue).then(function () {
      if (currentSendId !== id) return;      // a newer game has finished since
      setSendStatus(inQueue(id) ? 'fail' : 'ok');
    });
  }
  function submitResult() {
    if (!SHEET_URL) return;
    var rec = makeRecord();
    var q = loadQueue(); q.push(rec); saveQueue(q);   // saved first, so nothing is lost if offline / page closed
    currentSendId = rec.id;
    trySendCurrent();
  }

  /* ================= Wiring ================= */
  var nameInput = $('#nameInput');
  var savedName = store.get('moleName');
  if (savedName) nameInput.value = savedName;
  if (SHEET_URL) {
    $('#extraRow').hidden = false;
    $('#classInput').value = store.get('moleClass') || '';
    $('#classNoInput').value = store.get('moleClassNo') || '';
    ['#classInput', '#classNoInput'].forEach(function (sel) {
      $(sel).addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); startGame(); } });
    });
    $('#retryBtn').addEventListener('click', trySendCurrent);
    if (loadQueue().length) setTimeout(flushQueue, 1500);     // resend anything left over from offline play
    window.addEventListener('online', function () { flushQueue(); });
  }
  $('#startBtn').addEventListener('click', startGame);
  nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); startGame(); } });
  nameInput.addEventListener('input', function () { $('#nameError').hidden = true; });
  $('#againBtn').addEventListener('click', startGame);
  $('#changeBtn').addEventListener('click', function () {
    nameInput.value = '';
    state.phase = 'start';
    show('start');
    nameInput.focus();
  });
  $('#certBtn').addEventListener('click', downloadCertificate);

  // read-only hook for automated testing
  window.__moleGame = {
    get phase() { return state.phase; },
    get score() { return state.score; },
    get locked() { return state.locked; },
    get question() { return state.q ? { a: state.q.a, b: state.q.b, ans: state.q.ans, options: state.q.options.slice() } : null; },
    get wrongs() { return state.wrongs.slice(); },
    get queue() { return loadQueue(); },
    hintFor: hintFor, explainFor: explainFor, makeOptions: makeOptions
  };
})();
</script>
</body>
